function migrate(p){if(!p||p.format!=='deep-dive'||![1,2].includes(p.version))throw Error('This is not a supported Deep Dive pack.');p=clone(p);if(p.version===1){p.categories=clone(DEFAULT_CATEGORIES);if(!Array.isArray(p.questions))throw Error('Questions must be a list.');for(const q of p.questions){if(!Array.isArray(q.answers))throw Error('Answers must be a list.');for(const a of q.answers){if(!Number.isInteger(a.points)||a.points<0||a.points>100)throw Error('Invalid points in the older pack.');let cat=p.categories.find(c=>c.points===a.points);if(!cat){cat={id:'legacy-'+a.points,name:a.points+' points',points:a.points,color:'#9bacc5'};p.categories.push(cat)}a.category=cat.id;delete a.points}}p.version=2}return p}

function tone(freq=440,dur=.16,delay=0,type='sine',vol=.065,end=freq){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur)}catch{}}
function splash(){if(!sound)return;tone(320,.55,0,'sine',.04,65);tone(620,.4,.08,'triangle',.015,110);try{if(!ctx)return;const n=ctx.createBuffer(1,ctx.sampleRate*.35,ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.18;const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=n;filter.type='lowpass';filter.frequency.value=700;g.gain.setValueAtTime(.45,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);src.connect(filter);filter.connect(g);g.connect(ctx.destination);src.start()}catch{}}
function chime(points){const max=Math.max(1,...pack.categories.map(c=>c.points));[220,330,440,points/max>.8?880:550].forEach((f,i)=>tone(f,.4,i*.1,'triangle',.04))}
function stop(){clearInterval(timer);clearInterval(readTimer);timer=null;readTimer=null}

function home(){stop();if(run&&run.phase!=='done')run.phase='abandoned';setScreen('home');targetDepth=0;app.innerHTML=`<section class="home"><div class="masthead"><h1>DEEP DIVE</h1><div class="subtitle">THE CUSTOM DESCENT</div><div class="desc">${pack.questions.length} prompts · ${pack.seconds} seconds each · rarer answers sink deeper</div></div><div class="launch-pad"><h2 class="game-title">${esc(pack.title)}</h2><p class="pack-desc">${esc(pack.description)}</p><button class="primary begin" id="start">▼ BEGIN DESCENT ▼</button><div class="launch-tools"><button id="edit">EDIT GAME</button><button id="import">IMPORT PACK ↑</button><button id="share">EXPORT / SHARE ↗</button></div><div class="row small-tools"><button id="new">＋ New game</button><button id="restore">Restore draft</button><button id="help">▸ How to play</button></div><div class="standalone-note">ONE FILE · NO ACCOUNTS · NO INTERNET NEEDED</div></div></section>`;$('#start').onclick=start;$('#edit').onclick=()=>editor(false);$('#new').onclick=()=>editor(true);$('#import').onclick=()=>$('#fileInput').click();$('#share').onclick=share;$('#restore').onclick=restoreDraft;$('#help').onclick=help}
function help(){dialog(`<h2>HOW TO DIVE</h2><p>Answer each prompt before the clock runs out. Your creator chooses the categories and scores. Every point takes you 10 metres deeper.</p><p><b>Invalid answer?</b> Try again while the timer keeps running. A one-letter typo or swapped adjacent pair gets a confirmation; the clock pauses while you choose.</p><p>Accepted answers lock the round. You can browse all possible answers <b>only after you surface</b> at the end.</p><p>Edit prompts and answer categories in the workshop. Export a small JSON pack, or a complete portable HTML file that friends can open offline.</p><p><small>Category scores are creator-defined, not live popularity statistics. Files contain their answer lists; this is a friendly, offline game.</small></p><button id="helpDone" class="primary">GOT IT</button>`);$('#helpDone').onclick=closeDialog}
function restoreDraft(){try{let s=localStorage.getItem('deep-dive-draft-v2')||localStorage.getItem('deep-dive-draft');if(!s)return toast('No saved draft in this browser.');draft=migrate(JSON.parse(s));if(!Array.isArray(draft.questions)||!draft.questions.length||!Array.isArray(draft.categories)||!draft.categories.length)throw Error();selected=0;dirty=false;setScreen('editor');renderEditor();toast('Draft restored.')}catch{toast('Could not restore this draft. Import a saved pack instead.')}}

function blankAnswer(){return{text:'',category:draft.categories.find(c=>c.id==='schooler')?.id||draft.categories[0].id,aliases:[]}}
function editor(fresh){stop();setScreen('editor');draft=fresh?{format:'deep-dive',version:2,title:'My custom dive',description:'How well do you know our world?',seconds:25,categories:clone(DEFAULT_CATEGORIES),questions:[]}:clone(pack);if(fresh)draft.questions.push({prompt:'',answers:[blankAnswer()]});selected=0;dirty=false;targetDepth=1800;renderEditor()}
function options(id){return draft.categories.map(c=>`<option value="${esc(c.id)}" ${id===c.id?'selected':''}>${esc(c.name||'Unnamed category')} · ${Number.isFinite(c.points)?c.points:'?'} pts</option>`).join('')}
function renderEditor(){const q=draft.questions[selected];app.innerHTML=`<section class="editor"><div class="row spread"><div><div class="eyebrow">THE EXPEDITION WORKSHOP</div><h2>Make it your ocean.</h2></div><div class="row"><button class="primary" id="saveGame">Save & play</button><button id="exportDraft">Export / share</button></div></div><div class="status-note" id="saveState">Your prompts. Your answers. Your rules.</div><details class="category-manager" id="categoryManager"><summary>Scoring categories <small>· ${draft.categories.length} tiers · rename, rescore, or add your own</small></summary><p class="help">Each answer belongs to one category. Changing its points updates every answer in that category. Default scores match Krillion; 1 point = 10 metres.</p><div class="category-row answer-head"><span>Color</span><span>Category name</span><span>Points</span><span></span></div><div id="categoryRows"></div><button id="addCategory">＋ Add category</button></details><div class="editor-grid"><aside class="panel"><h3>Game details</h3><label for="title">Title</label><input id="title" maxlength="120" value="${esc(draft.title)}"><label for="desc">Description</label><textarea id="desc" rows="3" maxlength="2000">${esc(draft.description)}</textarea><label for="seconds">Seconds per question</label><input id="seconds" type="number" min="5" max="180" value="${draft.seconds}"><div id="tabs" style="margin-top:24px"></div><button id="addQ">＋ Add question</button></aside><section class="panel"><div class="row spread"><span class="eyebrow">QUESTION ${selected+1} / ${draft.questions.length}</span><div class="row"><button id="up" title="Move question earlier" ${selected===0?'disabled':''}>↑</button><button id="down" title="Move question later" ${selected===draft.questions.length-1?'disabled':''}>↓</button><button id="deleteQ" class="danger">Delete</button></div></div><label for="prompt">What would you like to ask?</label><textarea id="prompt" maxlength="500" rows="2" placeholder="e.g. Name someone in our friend group.">${esc(q.prompt)}</textarea><p class="help">Choose a category for each answer. Separate alternate spellings with <b>|</b>.</p><div class="answer-row answer-head"><span>Accepted answer</span><span>Aliases (optional)</span><span>Scoring category</span><span></span></div><div id="answers"></div><button id="addA">＋ Add answer</button><details style="margin-top:24px"><summary>Bulk add answers</summary><p class="help">One per line: <b>answer ; category name ; alias | alias</b><br>Example: Neptune ; Deep Cut ; Neptun<br>You can also use a point value. If no category uses it, one is created.</p><textarea id="bulk" rows="5" placeholder="Earth ; Plankton ; Terra&#10;Neptune ; Deep Cut"></textarea><button id="bulkAdd" style="margin-top:10px">Add these answers</button></details></section></div></section>`;
function tabs(){$('#tabs').innerHTML=draft.questions.map((v,i)=>`<button class="question-tab ${i===selected?'active':''}" data-q="${i}">${i+1}. ${esc(v.prompt||'Untitled question')}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.q;renderEditor()})}tabs();
function refreshSelectors(){$('#answers').querySelectorAll('select').forEach(el=>{const a=q.answers[+el.dataset.i];el.innerHTML=options(a.category)})}
function categories(){$('#categoryManager summary small').textContent='· '+draft.categories.length+' tiers · rename, rescore, or add your own';$('#categoryRows').innerHTML=draft.categories.map((c,i)=>`<div class="category-row"><input type="color" aria-label="Color for category ${i+1}" value="${esc(c.color)}" data-cat="${i}" data-k="color"><input aria-label="Name for category ${i+1}" value="${esc(c.name)}" maxlength="60" data-cat="${i}" data-k="name"><input aria-label="Points for category ${i+1}" type="number" min="0" max="10000" step="1" value="${Number.isFinite(c.points)?c.points:''}" data-cat="${i}" data-k="points"><button class="danger" data-delete-cat="${i}" title="Remove category ${i+1}">×</button></div>`).join('');$('#categoryRows').querySelectorAll('input').forEach(el=>el.oninput=()=>{draft.categories[+el.dataset.cat][el.dataset.k]=el.dataset.k==='points'?(el.value===''?null:Number(el.value)):el.value;refreshSelectors();saveDraft()});$('#categoryRows').querySelectorAll('button').forEach(el=>el.onclick=()=>{const c=draft.categories[+el.dataset.deleteCat];if(draft.categories.length===1)return toast('Keep at least one category.');const count=draft.questions.reduce((n,q)=>n+q.answers.filter(a=>a.category===c.id).length,0);if(count)return toast(`“${c.name}” is used by ${count} answers. Reassign those answers before deleting it.`);draft.categories.splice(+el.dataset.deleteCat,1);categories();refreshSelectors();saveDraft()})}categories();
function answers(){$('#answers').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><input aria-label="Answer ${i+1}" maxlength="150" value="${esc(a.text)}" data-i="${i}" data-k="text"><input aria-label="Aliases for answer ${i+1}" value="${esc(a.aliases.join(' | '))}" data-i="${i}" data-k="aliases"><select aria-label="Category for answer ${i+1}" data-i="${i}" data-k="category">${options(a.category)}</select><button class="danger" title="Remove answer ${i+1}" data-remove="${i}">×</button></div>`).join('');$('#answers').querySelectorAll('input,select').forEach(el=>el.oninput=()=>{q.answers[+el.dataset.i][el.dataset.k]=el.dataset.k==='aliases'?el.value.split('|').map(s=>s.trim()).filter(Boolean):el.value;saveDraft()});$('#answers').querySelectorAll('button').forEach(el=>el.onclick=()=>{q.answers.splice(+el.dataset.remove,1);answers();saveDraft()})}answers();
$('#addCategory').onclick=()=>{if(draft.categories.length>=50)return toast('Maximum 50 categories.');let n=1;while(draft.categories.some(c=>normalize(c.name)===normalize('Custom '+n)))n++;draft.categories.push({id:'custom-'+Date.now().toString(36)+'-'+n,name:'Custom '+n,points:100,color:'#f4d77b'});categories();refreshSelectors();saveDraft();$('#categoryRows').lastElementChild.querySelector('[data-k=name]').focus()};
['title','desc','seconds'].forEach(id=>$('#'+id).oninput=e=>{draft[id==='desc'?'description':id]=id==='seconds'?(e.target.value===''?null:Number(e.target.value)):e.target.value;saveDraft()});$('#prompt').oninput=e=>{q.prompt=e.target.value;tabs();saveDraft()};$('#addA').onclick=()=>{if(q.answers.length>=1000)return toast('Maximum 1,000 answers per question.');q.answers.push(blankAnswer());answers();saveDraft();$('#answers').lastElementChild.querySelector('input').focus()};$('#addQ').onclick=()=>{if(draft.questions.length>=100)return toast('Maximum 100 questions.');draft.questions.push({prompt:'',answers:[blankAnswer()]});selected=draft.questions.length-1;renderEditor();saveDraft()};$('#deleteQ').onclick=()=>{if(draft.questions.length===1)return toast('Keep at least one question.');if(!confirm('Delete this question and its answers?'))return;draft.questions.splice(selected,1);selected=Math.min(selected,draft.questions.length-1);renderEditor();saveDraft()};for(const [id,delta] of [['up',-1],['down',1]])$('#'+id).onclick=()=>{let j=selected+delta;[draft.questions[selected],draft.questions[j]]=[draft.questions[j],draft.questions[selected]];selected=j;renderEditor();saveDraft()};
$('#bulkAdd').onclick=()=>{try{const lines=$('#bulk').value.split('\n').filter(s=>s.trim());if(!lines.length)throw Error('Paste some answers first.');const nextCats=clone(draft.categories);const add=lines.map((line,i)=>{const parts=line.split(';').map(s=>s.trim());if(parts.length<2||parts.length>3||!parts[0]||!parts[1])throw Error(`Line ${i+1}: use answer ; category ; optional aliases.`);let c=nextCats.find(c=>normalize(c.name)===normalize(parts[1]));if(!c&&/^\d+$/.test(parts[1])){const pts=Number(parts[1]);if(pts>10000)throw Error(`Line ${i+1}: maximum 10,000 points.`);const matches=nextCats.filter(c=>c.points===pts);if(matches.length>1)throw Error(`Line ${i+1}: more than one category has ${pts} points. Use its name.`);c=matches[0];if(!c){c={id:'points-'+pts+'-'+Date.now().toString(36),name:pts+' points',points:pts,color:'#9fb8df'};nextCats.push(c)}}if(!c)throw Error(`Line ${i+1}: category “${parts[1]}” not found.`);return{text:parts[0],category:c.id,aliases:(parts[2]||'').split('|').map(s=>s.trim()).filter(Boolean)}});if(nextCats.length>50)throw Error('Maximum 50 categories.');const next=q.answers.filter(a=>a.text.trim()||a.aliases.length).concat(add);if(next.length>1000)throw Error('Maximum 1,000 answers per question.');draft.categories=nextCats;q.answers=next;categories();answers();$('#bulk').value='';saveDraft();toast(`${add.length} answers added.`)}catch(e){toast(e.message)}};$('#saveGame').onclick=()=>{try{pack=validate(draft);dirty=false;home();toast('Game ready. Begin descent to play.')}catch(e){toast(e.message)}};$('#exportDraft').onclick=()=>{try{pack=validate(draft);dirty=false;share()}catch(e){toast(e.message)}}}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function slug(){return pack.title.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,70)||'custom-dive'}
function portableHTML(){const safe=JSON.stringify(pack).replace(/</g,'\\u003c');return originalHTML.replace(/(<script id="embedded-pack" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+safe+b)}
function share(){dialog(`<div class="eyebrow">SEND AN EXPEDITION</div><h2>GOOD QUESTIONS TRAVEL.</h2><p><b>Portable HTML</b> includes your game, editor, art, font, and sound. Your friend downloads the file and opens it in a desktop browser.</p><button class="primary" id="htmlExport">DOWNLOAD PORTABLE HTML</button><p><b>Game pack</b> is a small JSON file containing your prompts, answers, and custom categories. Import it into this version of Deep Dive.</p><button id="jsonExport">DOWNLOAD GAME PACK</button><p><small>Older packs still import with their original points. If a service blocks HTML attachments, ZIP the file first. Exported packs include answer lists.</small></p><button class="quiet" id="closeShare">DONE</button>`);$('#closeShare').onclick=closeDialog;$('#jsonExport').onclick=()=>download(JSON.stringify(pack,null,2),slug()+'.deepdive.json','application/json');$('#htmlExport').onclick=()=>{download(portableHTML(),slug()+'.html','text/html');toast('Portable game exported.')}}
$('#fileInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>5*1024*1024)return toast('Choose a game pack smaller than 5 MB.');try{pack=validate(JSON.parse(await f.text()));dirty=false;home();toast('Imported: '+pack.title)}catch(err){toast('Import failed: '+err.message)}};
function oneOff(a,b){a=Array.from(a);b=Array.from(b);if(Math.abs(a.length-b.length)>1)return false;if(a.length===b.length){const dif=[];for(let i=0;i<a.length;i++)if(a[i]!==b[i])dif.push(i);return dif.length===1||(dif.length===2&&dif[1]===dif[0]+1&&a[dif[0]]===b[dif[1]]&&a[dif[1]]===b[dif[0]])}if(a.length>b.length)[a,b]=[b,a];let i=0,j=0,miss=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++}else{miss++;j++;if(miss>1)return false}}return true}
function hud(){const n=pack.questions.length;return `<div class="hud"><div class="hud-box"><div class="hud-label">DEPTH</div><div class="depth" id="depth">${(run.total*10).toLocaleString()}m</div></div><div class="rounds"><div class="round-blocks">${Array.from({length:Math.min(n,30)},(_,i)=>`<i class="${i<run.index?'done':i===run.index?'active':''}"></i>`).join('')}</div>PROMPT ${Math.min(run.index+1,n)} OF ${n}</div><div class="hud-box"><div class="hud-label">SCORE</div><div class="score" id="score">${run.total.toLocaleString()}</div></div></div>`}
function start(){stop();run={index:0,total:0,results:[],phase:'reading',attempts:0};targetDepth=0;setScreen('play');splash();question()}
function question(){stop();run.phase='reading';run.attempts=0;const q=pack.questions[run.index];app.innerHTML=`<section class="play"><div class="dive-stage">${hud()}<div class="question-card pixel-panel"><div class="eyebrow">PROMPT ${run.index+1} OF ${pack.questions.length}</div><h2 class="prompt">${esc(q.prompt)}</h2><small>▼ rarer answers sink deeper ▼</small></div><div id="countdown" class="countdown-panel pixel-panel">descending · the clock starts in <b id="readCount">3</b></div><div class="play-controls" id="playControls" hidden><form id="answerForm"><div class="input-row"><div class="clock" id="clock" aria-label="Seconds remaining">${pack.seconds}</div><input id="guess" class="answer-input" autocomplete="off" spellcheck="false" maxlength="150" aria-label="Your answer" placeholder="type one answer…" disabled><button class="pink" id="submitAnswer" type="submit">DIVE</button></div><div class="progress"><i id="bar"></i></div><p class="inline-error" id="answerError" role="status" aria-live="polite"></p><div class="below-input"><small>Invalid answers? Keep trying until time runs out.</small><button type="button" id="skip">skip round →</button></div></form></div></div></section>`;$('#answerForm').onsubmit=e=>{e.preventDefault();submit()};$('#skip').onclick=()=>finish(null,'Skipped');let readEnd=performance.now()+3000;readTimer=setInterval(()=>{const left=Math.ceil((readEnd-performance.now())/1000);if(left<=0){clearInterval(readTimer);readTimer=null;beginAnswer()}else $('#readCount').textContent=left},80)}
function beginAnswer(){if(run.phase!=='reading')return;run.phase='answer';run.deadline=performance.now()+pack.seconds*1000;run.lastTick=-1;$('#countdown').hidden=true;$('#playControls').hidden=false;$('#guess').disabled=false;$('#guess').focus();tone(440,.13);timer=setInterval(tick,80)}
function tick(){if(run?.phase!=='answer')return;const ms=run.deadline-performance.now(),s=Math.max(0,Math.ceil(ms/1000));$('#clock').textContent=s;$('#clock').classList.toggle('urgent',s<=5);$('#bar').style.width=Math.max(0,ms/(pack.seconds*10))+'%';if(s<=5&&s>0&&s!==run.lastTick){tone(650,.06,0,'sine',.02);run.lastTick=s}if(ms<=0)finish(null,'Time ran out')}
function invalid(raw){if(run.phase==='confirm'){closeDialog();run.phase='answer';run.deadline=performance.now()+run.remaining;timer=setInterval(tick,80)}if(run.phase!=='answer')return;run.attempts++;$('#answerError').textContent=`“${raw}” isn't in this game's answer list. Try again.`;$('#guess').setAttribute('aria-invalid','true');$('#guess').classList.remove('shake');void $('#guess').offsetWidth;$('#guess').classList.add('shake');$('#guess').focus();$('#guess').select();tone(150,.16,0,'triangle',.035,95)}
function submit(){if(run.phase!=='answer')return;if(performance.now()>=run.deadline)return finish(null,'Time ran out');const raw=$('#guess').value.trim();if(!raw)return toast('Type an answer, or skip this round.');const n=normalize(raw),answers=pack.questions[run.index].answers,exact=answers.find(a=>[a.text,...a.aliases].some(s=>normalize(s)===n));if(exact)return finish(exact,raw);const matches=answers.filter(a=>[a.text,...a.aliases].some(s=>oneOff(n,normalize(s))));if(!matches.length)return invalid(raw);run.remaining=Math.max(0,run.deadline-performance.now());run.phase='confirm';clearInterval(timer);timer=null;dialog(`<div class="eyebrow">A TINY COURSE CORRECTION</div><h2>DID YOU MEAN…?</h2><p>You typed “${esc(raw)}”. The clock is paused while you choose.</p><div id="suggestions" style="display:grid;gap:10px">${matches.map((a,i)=>`<button class="primary" data-match="${i}">${esc(a.text)}</button>`).join('')}</div><div class="row" style="margin-top:22px"><button id="retry">KEEP TYPING</button><button class="quiet" id="asTyped">SUBMIT AS TYPED</button></div>`);$('#suggestions').querySelectorAll('button').forEach(b=>b.onclick=()=>{closeDialog();finish(matches[+b.dataset.match],raw,true)});$('#retry').onclick=resume;$('#asTyped').onclick=()=>invalid(raw)}
function resume(){closeDialog();if(run?.phase==='confirm'){run.phase='answer';run.deadline=performance.now()+run.remaining;timer=setInterval(tick,80);$('#guess').focus()}}
$('#modal').addEventListener('cancel',e=>{if(run?.phase==='confirm'){e.preventDefault();resume()}});
function icon(c){if(c&&ASSETS[c.id])return `<img class="tier-icon" src="${ASSETS[c.id]}" alt="">`;if(c?.id==='krillion')return `<img class="tier-icon" src="${ASSETS.krill}" alt="">`;if(c?.id==='rare')return `<img class="tier-icon" src="${ASSETS.rare}" alt="">`;return `<div class="glyph-icon" aria-hidden="true">${c?.id==='plankton'?'·°·':c?.id==='too-clever'?'¿?':c?.id==='schooler'?'≋':c?.id==='deep-cut'?'✦':c?'◈':'×'}</div>`}
function finish(answer,raw,corrected=false){if(!run||!['answer','confirm'].includes(run.phase))return;stop();run.phase='result';const cat=answer?category(answer.category):null,points=cat?.points||0;run.total+=points;targetDepth=run.total*10;descentPulse=1;run.results.push({prompt:pack.questions[run.index].prompt,raw,answer:answer?.text||null,category:cat?.id||null,points,corrected,attempts:run.attempts});if(answer){chime(points);splash()}else tone(110,.45,0,'triangle');app.innerHTML=`<section class="play"><div class="dive-stage">${hud()}<div class="reward pixel-panel" style="--tier:${cat?.color||'#8ea5c2'}">${icon(cat)}<div class="tier-name">${esc(cat?.name||'DRIFTING')}</div><div class="locked-answer">${answer?'“'+esc(answer.text)+'”':esc(raw)}</div><div class="gain">${answer?'+'+points+' PTS · SINK '+(points*10).toLocaleString()+'m':'NO DESCENT THIS ROUND'}</div><p>${corrected?'Typo corrected. Answer locked.':answer?'Answer locked. Down we go.':'Another question waits below.'}</p></div><div class="descend-action"><button id="next" class="primary">${run.index+1===pack.questions.length?'▲ SURFACE & VIEW RESULTS':'DESCEND ▼'}</button></div></div></section>`;$('#next').onclick=()=>{run.index++;if(run.index>=pack.questions.length)results();else question()};$('#next').focus()}
function results(){stop();setScreen('results');run.phase='done';targetDepth=0;splash();const max=pack.questions.reduce((s,q)=>s+Math.max(...q.answers.map(a=>pointsOf(a))),0);app.innerHTML=`<section class="results"><div class="panel results-head"><div class="eyebrow">${esc(pack.title)}</div><h1 style="margin-top:18px">YOU SURFACED.</h1><div class="big-depth">${(run.total*10).toLocaleString()}<span> m</span></div><p>${run.total.toLocaleString()} / ${max.toLocaleString()} points · ${run.results.filter(r=>r.answer).length} / ${pack.questions.length} accepted</p><div class="row results-actions"><button id="copyResults" class="primary">COPY RESULTS</button><button id="saveResults">SAVE RESULTS</button><button id="replay">DIVE AGAIN</button></div></div><p style="text-align:center;margin:25px 0 15px">▼ Click a question to explore every possible answer ▼</p><div class="log">${run.results.map((r,i)=>{const cat=r.category?category(r.category):null;return `<details class="log-question" data-question="${i}" style="--tier:${cat?.color||'#91a4be'}"><summary><span class="log-number">${i+1}</span><span>${esc(r.prompt)}<small>${esc(r.answer||r.raw)}${r.corrected?' · typo corrected':''}</small></span><span class="log-score">${r.points} pts<small>${esc(cat?.name||'No answer')} ▾</small></span></summary><div class="answer-browser"><input class="answer-filter" aria-label="Search answers for question ${i+1}" placeholder="search all answers…"><div class="answer-scroll" tabindex="0" aria-label="Possible answers for question ${i+1}"></div></div></details>`}).join('')}</div><div class="row" style="justify-content:center;margin-top:22px"><button id="back">BACK TO SURFACE</button></div></section>`;
app.querySelectorAll('.log-question').forEach(el=>{const i=+el.dataset.question,q=pack.questions[i],r=run.results[i];function reveal(filter=''){const n=normalize(filter);const groups=pack.categories.slice().sort((a,b)=>b.points-a.points).map(cat=>{const list=q.answers.filter(a=>a.category===cat.id&&[a.text,...a.aliases].some(s=>normalize(s).includes(n))).sort((a,b)=>a.text.localeCompare(b.text));if(!list.length)return '';return `<section class="reveal-category" style="--tier:${cat.color}"><h3><span>${esc(cat.name)} (${list.length})</span><span>${cat.points} pts</span></h3>${list.map(a=>`<div class="reveal-answer ${r.answer===a.text?'mine':''}"><span>${esc(a.text)}</span>${r.answer===a.text?'<small>YOUR ANSWER ✓</small>':''}</div>`).join('')}</section>`}).join('');el.querySelector('.answer-scroll').innerHTML=groups||'<p>No matching answers.</p>'}el.addEventListener('toggle',()=>{if(el.open&&!el.dataset.loaded){reveal();el.dataset.loaded='true'}});el.querySelector('input').oninput=e=>reveal(e.target.value)});
$('#replay').onclick=start;$('#back').onclick=home;const txt=()=>`DEEP DIVE — ${pack.title}\n${run.total*10} m • ${run.total}/${max} points\n`+run.results.map((r,i)=>`${i+1}. ${r.answer?'◆':'◇'} ${r.points} pts${r.category?' · '+category(r.category).name:''}`).join('\n');$('#saveResults').onclick=()=>download(txt(),slug()+'-results.txt','text/plain');$('#copyResults').onclick=async()=>{try{await navigator.clipboard.writeText(txt());toast('Results copied.')}catch{dialog(`<h2>COPY YOUR RESULTS</h2><textarea id="copyText" rows="12" readonly>${esc(txt())}</textarea><p>Press Ctrl+C (or Cmd+C).</p><button id="copyDone">DONE</button>`);$('#copyText').select();$('#copyDone').onclick=closeDialog}}}
$('#homeBtn').onclick=()=>{if(screen==='play'&&!confirm('Leave this dive? Your current run will end.'))return;if(screen==='editor'&&dirty&&!confirm('Leave the editor? Export first for a reliable copy. Your browser draft is kept when storage is available.'))return;home()};$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').textContent=sound?'♫ SOUND ON':'♫ SOUND OFF';$('#soundBtn').setAttribute('aria-pressed',String(sound));if(sound)tone(440)};$('#creditsBtn').onclick=()=>{dialog(`<h2>DEEP DIVE · CUSTOM EDITION</h2><p class="credits">An independent, offline custom-game player inspired by <a href="https://krillion.io" target="_blank" rel="noopener">Krillion</a>. Not affiliated with its creator.</p><p class="credits">Tier sprites and the underwater background are embedded from krillion.io. Original asset rights remain with their creators. Pixel font: VT323 by Peter Hull (SIL Open Font License). Ocean scene, workshop, game logic, and synthesized sounds are built for this custom edition.</p><button id="creditsDone">DONE</button>`);$('#creditsDone').onclick=closeDialog};window.addEventListener('beforeunload',e=>{if(screen==='editor'&&dirty){e.preventDefault();e.returnValue=''}});
// Pixel ocean renderer. All art is embedded; the game makes no network requests.
const canvas=$('#ocean'),c=canvas.getContext('2d'),waterImg=new Image(),krillImg=new Image();waterImg.src=ASSETS.water;krillImg.src=ASSETS.krill;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w=0,h=0,last=0,sceneTime=0,surfaceY=0;const bubbles=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:Math.random()*.016+.005,r:Math.random()<.7?1:2})),fish=Array.from({length:25},()=>({x:Math.random(),y:Math.random()*1500,s:Math.random()*.014+.009,size:Math.floor(Math.random()*3)+2,dir:Math.random()<.5?-1:1}));
function resize(){w=Math.ceil(innerWidth/3);h=Math.ceil(innerHeight/3);canvas.width=w;canvas.height=h;c.imageSmoothingEnabled=false;if(!surfaceY)surfaceY=h*.53}window.addEventListener('resize',resize);resize();
function rect(x,y,width,height,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(width),Math.round(height))}
function cloud(x,y,s){c.save();c.translate(Math.round(x),Math.round(y));c.scale(s,s);c.fillStyle='#e9f2f0';const blocks=[[0,12,70,6],[7,7,54,7],[18,0,21,10],[13,4,36,10],[34,5,17,9],[48,10,16,7]];blocks.forEach(b=>c.fillRect(...b));c.fillStyle='#d0e0e5';c.fillRect(0,15,52,3);c.restore()}
function boat(x,y,t){c.save();c.translate(Math.round(x),Math.round(y+(reduced?0:Math.sin(t*.001)*1.3)));c.fillStyle='#082b3b';[[0,0,40,3],[2,3,35,3],[6,6,27,2],[14,-9,16,10],[16,-11,18,2],[18,-25,2,17],[35,-3,9,3]].forEach(b=>c.fillRect(...b));c.fillStyle='#b9ddea';c.fillRect(17,-7,3,5);c.fillRect(23,-7,3,5);c.fillStyle='#fa4e89';c.fillRect(10,-25,8,5);c.fillRect(8,-23,3,2);c.restore()}
function fishSprite(x,y,s,dir,color){c.save();c.translate(Math.round(x),Math.round(y));c.scale(dir,1);rect(-s,-s/2,s*3,s,color);rect(0,-s,s,s*2,color);rect(-s*2,-s,s/2,s*2,color);rect(-s*1.5,-s/2,s,s,color);c.restore()}
function jelly(x,y,t,color){c.save();c.translate(Math.round(x),Math.round(y));rect(-5,-3,10,3,color);rect(-7,0,14,5,color);rect(-4,-5,8,2,color);for(let j=-5;j<=5;j+=3){let bend=reduced?0:Math.sin(t*.002+j)*2;rect(j,5,1,6,color);rect(j+bend,11,1,5,color)}c.restore()}
function frame(t){let dt=Math.min(40,t-last||16);last=t;if(!reduced)sceneTime+=dt;visualDepth+=(targetDepth-visualDepth)*(reduced?1:.035);if(Math.abs(targetDepth-visualDepth)<.05)visualDepth=targetDepth;if(screen==='play'){const counter=$('#depth');if(counter)counter.textContent=Math.round(visualDepth).toLocaleString()+'m';}const mode=screen,desiredSurface=mode==='home'?h*.54:mode==='results'?h*.35:mode==='editor'?-h:h*.23-Math.min(visualDepth,20000)*.35;surfaceY+=(desiredSurface-surfaceY)*(reduced?1:.045);descentPulse*=.97;const deep=Math.min(1,visualDepth/3500);c.clearRect(0,0,w,h);
const ocean=c.createLinearGradient(0,0,0,h);ocean.addColorStop(0,`rgb(${Math.round(10-deep*7)},${Math.round(69-deep*52)},${Math.round(105-deep*72)})`);ocean.addColorStop(1,`rgb(3,${Math.round(31-deep*22)},${Math.round(52-deep*30)})`);c.fillStyle=ocean;c.fillRect(0,0,w,h);
if(mode==='editor'){if(waterImg.complete&&waterImg.naturalWidth)c.drawImage(waterImg,0,0,w,h);rect(0,0,w,h,'#040d18a0')}else{
if(surfaceY>0){const sky=c.createLinearGradient(0,0,0,Math.max(1,surfaceY));sky.addColorStop(0,'#91c9da');sky.addColorStop(1,'#e0f3f5');c.fillStyle=sky;c.fillRect(0,0,w,surfaceY+2);const sy=surfaceY-h*.50;rect(w*.79,sy+17,34,31,'#f2d47c');rect(w*.79-3,sy+23,40,20,'#f2d47c');rect(w*.79+6,sy+13,21,40,'#f2d47c');cloud(w*.09+(reduced?0:Math.sin(sceneTime*.000015)*5),sy+26,1.5);cloud(w*.55,sy+21,1);cloud(w*.39,sy+67,1.05);cloud(w*.88,sy+75,1.15);boat(w*.28,surfaceY-4,sceneTime);c.beginPath();c.moveTo(0,surfaceY);for(let x=0;x<=w+3;x+=3)c.lineTo(x,surfaceY+(reduced?0:Math.sin(x*.05+sceneTime*.0008)*1.2));c.lineTo(w,h);c.lineTo(0,h);c.closePath();c.fillStyle=ocean;c.fill();}
if(surfaceY<h*.4&&deep<.5){for(let i=0;i<4;i++){c.fillStyle=`rgba(96,180,192,${.022*(1-deep)})`;c.beginPath();c.moveTo(w*(i*.25+.10),Math.max(0,surfaceY));c.lineTo(w*(i*.25+.3),h);c.lineTo(w*(i*.25+.47),h);c.closePath();c.fill()}}
for(const f of fish){const yy=((f.y-visualDepth*.06)%(h+80)+(h+80))%(h+80)-20;if(yy<surfaceY+28)continue;let xx=(f.x*w+(reduced?0:sceneTime*f.s*f.dir))%(w+30);if(xx< -15)xx+=w+30;fishSprite(xx,yy,f.size,f.dir,deep>.4?'#093042':'#03283b')}
if(visualDepth>800&&visualDepth<4000)for(let j=0;j<3;j++){const jy=(h*.4+j*47-visualDepth*.05+h*10)%h;jelly(w*(j%2?.82:.17),jy,sceneTime+j*900,j===1?'#8e6bb680':'#59d5d066')}
if(visualDepth>2800){c.save();c.globalAlpha=Math.min(.38,(visualDepth-2800)/7000);if(waterImg.complete&&waterImg.naturalWidth)c.drawImage(waterImg,0,0,w,h);c.restore()}
for(const b of bubbles){if(!reduced){b.y-=b.s*dt/h;if(b.y<0)b.y=1}let by=b.y*h;if(by<surfaceY+3)continue;const bx=b.x*w;c.fillStyle='#b2f3f039';if(b.r===1)c.fillRect(bx,by,1,1);else{c.strokeStyle='#9fe5f34d';c.strokeRect(Math.round(bx),Math.round(by),1,1)}}
// Depth ruler tracks the same world coordinates as the surface.
const rx=w-Math.max(14,(w-330)/2);c.strokeStyle='#acd9e84d';c.beginPath();c.moveTo(rx,Math.max(0,surfaceY));c.lineTo(rx,h-18);c.stroke();c.font='4px monospace';c.textAlign='right';for(let i=0;i<14;i++){const step=100,first=Math.max(0,Math.floor(visualDepth/step)-3),d=(first+i)*step,y=surfaceY+d*.35;if(y<0||y>h-18)continue;c.strokeStyle='#98ccdd44';c.beginPath();c.moveTo(rx-(i%2?2:4),y);c.lineTo(rx,y);c.stroke();if(d%200===0){c.fillStyle='#a1c3d17a';c.fillText(d+'m',rx-6,y+1)}}
if(krillImg.complete&&krillImg.naturalWidth){const kx=mode==='home'?w*.53:w*.19+(reduced?0:Math.sin(sceneTime*.0008)*10),ky=mode==='home'?surfaceY+18:Math.max(surfaceY+20,h*.66)+(reduced?0:Math.sin(sceneTime*.002)*3);c.drawImage(krillImg,Math.round(kx-11),Math.round(ky-11),22,22);for(let i=0;i<5;i++){const by=ky-10-((sceneTime*.015+i*7)%35);c.strokeStyle='#9ee4ef88';c.strokeRect(Math.round(kx+7+Math.sin(i+sceneTime*.002)*3),Math.round(by),1,1)}}
const landmark=visualDepth<200?'':visualDepth<1000?'SUNLIGHT FADES ABOVE':visualDepth<4000?'THE MIDNIGHT ZONE':visualDepth<6000?'THE ABYSSAL ZONE':'THE HADAL ZONE';if(mode==='play'&&landmark){c.textAlign='left';c.font='4px monospace';c.fillStyle='#c1d7e04f';c.fillText(landmark,12,h*.50)}
const vignette=c.createLinearGradient(0,h*.73,0,h);vignette.addColorStop(0,'#030b1700');vignette.addColorStop(1,'#030b17ec');c.fillStyle=vignette;c.fillRect(0,h*.73,w,h*.27);
}requestAnimationFrame(frame)}requestAnimationFrame(frame);home();
